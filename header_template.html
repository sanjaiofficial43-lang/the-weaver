<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pure handloom cotton sarees woven by our family in Madurai. Shop online with worldwide shipping or visit our store in Sakkimangalam, Madurai.">
    <title>Pure Handloom Cotton Sarees | Madurai | The Weavura</title>
    <meta name="google-site-verification" content="rXUwhoizlkChEJ-9qhmsoWdjBPgUV6GyZp1cfGZ-kRA" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500&display=swap');
        
        :root {
            --maroon: #540C0C;
            --gold: #C09C3C;
            --color-bg: #FBF7F0;
            --color-text: #2A2320;
            --color-accent: #540C0C;
        }

        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
        }
        
        h1, h2, h3, h4, h5, h6, .serif-font {
            font-family: 'Cormorant Garamond', serif;
        }
        
        .bg-maroon { background-color: var(--maroon); }
        .text-maroon { color: var(--maroon); }
        .border-maroon { border-color: var(--maroon); }
        
        .bg-gold { background-color: var(--gold); }
        .text-gold { color: var(--gold); }
        
        .hero-section {
            background-image: url('hero-bg.jpg');
            background-size: cover;
            background-position: center;
            height: 650px;
            width: 100%;
        }

        /* Mobile responsiveness for hero image with embedded text */
        @media (max-width: 768px) {
            .hero-section {
                background-image: url('hero-bg-mobile.jpg');
                height: 115vw; /* Portrait aspect ratio for mobile */
                background-position: center; 
            }
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="antialiased">

    <!-- Top Announcement Bar -->
    <div class="bg-maroon text-white text-[11px] md:text-xs py-2 px-6 flex justify-between items-center tracking-widest font-light">
        <div class="container mx-auto max-w-7xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fab fa-envira"></i> <span>100% Handloom</span>
            </div>
            <div class="hidden md:flex items-center gap-2">
                <i class="fas fa-map-marker-alt"></i> <a href="/store" class="hover:underline">Visit Our Store in Madurai</a>
            </div>
            <div class="flex items-center gap-2">
                <i class="fas fa-truck"></i> <span>Worldwide Shipping</span>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="bg-[#f4ebe1] sticky top-0 z-50 border-b border-[#e5dccf]">
        <div class="container mx-auto px-6 py-6 flex items-center justify-between max-w-7xl">
            <!-- Hamburger Menu (Mobile) -->
            <div class="w-1/4 md:hidden">
                <button id="hamburger-btn" class="text-maroon text-xl"><i class="fas fa-bars"></i></button>
            </div>

            <!-- Empty Left space for balance on desktop -->
            <div class="w-1/4 hidden md:flex gap-4">
            </div>
            
            <!-- Logo (Center) -->
            <div class="w-1/2 md:w-2/4 text-center">
                <a href="/" class="text-3xl md:text-5xl font-normal serif-font text-maroon tracking-widest uppercase">The Weavura</a>
            </div>
            
            <!-- Icons & Search (Right) -->
            <div class="w-1/4 flex justify-end items-center gap-5 md:gap-6 text-maroon">
                <a href="javascript:void(0)" id="search-icon" class="hover:opacity-70 transition"><i class="fas fa-search text-lg font-light"></i></a>
                <a href="javascript:void(0)" id="account-icon" class="hover:opacity-70 transition hidden md:block"><i class="far fa-user text-lg font-light"></i></a>
                <a href="javascript:void(0)" id="wishlist-icon" class="hover:opacity-70 transition hidden md:block"><i class="far fa-heart text-lg font-light"></i></a>
                <a href="javascript:void(0)" id="envelope-icon" class="hover:opacity-70 transition hidden md:block"><i class="far fa-envelope text-lg font-light"></i></a>
                <a href="javascript:void(0)" id="cart-icon" class="hover:opacity-70 transition relative mt-1">
                    <i class="fas fa-shopping-bag text-xl font-light"></i>
                    <span id="cart-count" class="absolute -top-1 -right-2 bg-maroon text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-[#f4ebe1]">0</span>
                </a>
            </div>
        </div>
        
        <!-- Navigation Bar -->
        <nav class="hidden md:block pb-5">
            <ul class="flex justify-center gap-10 text-[11px] font-medium text-maroon/80 uppercase tracking-[0.15em]">
                <li><a href="/collections/handloom-cotton-sarees" class="hover:text-maroon transition">Handloom Cotton Sarees</a></li>
                <li><a href="/collections/new-arrivals" class="hover:text-maroon transition">New Arrivals</a></li>
                <li><a href="/collections/bestsellers" class="hover:text-maroon transition">Bestsellers</a></li>
                <!-- TODO: Create pages and unhide these when enough products exist: 
                <li><a href="/collections/temple-border-cotton-sarees" class="hover:text-maroon transition">Temple Border</a></li>
                <li><a href="/collections/checked-cotton-sarees" class="hover:text-maroon transition">Checked Sarees</a></li>
                -->
            </ul>
        </nav>
    </header>
